<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Age Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">Local computer vision</p>
        <h1>Age Detector</h1>
        <p class="intro">Upload, paste, or capture a photo to estimate apparent age.</p>
      </header>

      <section class="panel" aria-labelledby="source-title">
        <h2 id="source-title">Choose an image</h2>
        <div class="preview-wrap">
          <video id="video" class="preview" autoplay muted playsinline hidden></video>
          <img id="preview" class="preview" alt="Selected face" hidden />
          <div id="placeholder" class="placeholder">No image selected</div>
        </div>

        <div class="controls">
          <label class="button secondary" for="file">Upload photo</label>
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
          <button id="paste" class="button secondary" type="button">Paste image</button>
          <button id="camera" class="button secondary" type="button">Use camera</button>
          <button id="capture" class="button" type="button" hidden>Capture</button>
          <button id="estimate" class="button primary" type="button" disabled>Estimate age</button>
        </div>
      </section>

      <section id="results" class="panel" aria-live="polite" hidden>
        <h2>Result</h2>
        <div id="result-content"></div>
      </section>

      <p class="notice">
        This is an approximate estimate of visible age, not a person's actual age.
        Do not use it for identification or consequential decisions.
      </p>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
